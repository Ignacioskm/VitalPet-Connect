services:
  # ─── Base de Datos Única ───────────────────────────────────────
  db-master:
    image: mysql:8.0
    command:
      - --innodb-buffer-pool-size=256M
      - --max_connections=200
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
    ports:
      - "3306:3306"
    volumes:
      - ./init-dbs.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - vitalpet-network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '1.0'
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  # ─── Infraestructura ──────────────────────────────────────────
  eureka-server:
    build: ./infrastructure/eureka-server
    ports:
      - "8761:8761"
    networks:
      - vitalpet-network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 768M
          cpus: '1.0'
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8761/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s

  api-gateway:
    build: ./infrastructure/api-gateway
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
    depends_on:
      eureka-server:
        condition: service_started
    networks:
      - vitalpet-network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 768M
          cpus: '1.0'

  # ─── Microservicios de Negocio (perfil por defecto) ───────────
  ms-auth:
    build: ./ms-auth
    ports:
      - "8081:8081"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      DB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
    depends_on:
      db-master:
        condition: service_healthy
      eureka-server:
        condition: service_started
    networks:
      - vitalpet-network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 768M
          cpus: '1.0'

  ms-users:
