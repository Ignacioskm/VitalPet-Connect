server:
  port: 8082
  forward-headers-strategy: framework #Esto es para que swagger no se salte la api-gateway CREO

spring:
  application:
    name: ms-users
  datasource:
    url: jdbc:mysql://localhost:3307/vitalpet_users?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
    username: root
    password: ${DB_ROOT_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: create
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQL8Dialect
    defer-datasource-initialization: true # Esto hace que hibernate espere creer las tablas pa meter los datos.
  sql:
    init:
      mode: always #Con esta wea obligamos a buscar el archivo data.sql

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true

#Rutas swagger
springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /api/user/v3/api-docs